# media-dedup configuration — created on first run, edit it freely.
#
# Precedence, from the strongest: command-line options > MEDIA_DEDUP_* environment
# variables (e.g. MEDIA_DEDUP_GENERAL__LOCALE=fr) > this file > built-in defaults.
# Run `media-dedup config` to see every effective value and where it comes from.

[general]
# Interface language: "en" or "fr".                              CLI: --locale
locale = "en"
# How much to log: "error", "warning", "info" or "debug".        CLI: --verbosity
verbosity = "info"
# ANSI colours: "auto", "always" or "never".                    CLI: --color
color = "auto"

[folders]
# Host paths, written between 'single quotes' so backslashes need no escaping.
# These are lists of paths: your real folders are never renamed.
#
# Copies found in these folders are kept first, in this order.     CLI: --prefer
preferred = []
# Never modified. Their files are always the copies kept, so identical
# files elsewhere ARE deleted (a "master library").                CLI: --protect
protected = []
# Never analysed: e.g. a real backup that must remain a second copy. CLI: --exclude
excluded = []
# Example:
# preferred = ['C:\Family Photos', 'C:\Users\Public\Pictures']
# protected = ['C:\Family Photos\Albums']
# excluded = ['D:\backup']

[scan]
# Only analyse these extensions, e.g. ["png", "webp"]. Empty: every supported
# one (`media-dedup audit --help` lists them).                    CLI: --ext
extensions = []

[clean]
# Ask for confirmation before cleaning.                            CLI: --yes
confirm = true
